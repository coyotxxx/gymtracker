name: Build APK

on:
  push:
    branches: [ main, master, redesign-v2 ]
  workflow_dispatch:   # ręczne uruchomienie z GitHuba

permissions:
  contents: write   # potrzebne do auto-commit debug.keystore (raz)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      # Stały debug keystore — bez tego każdy build ma inną sygnaturę i Android
      # odmawia aktualizacji ('Nie zainstalowano aplikacji'). Generujemy raz,
      # commitujemy do repo, kolejne buildy używają tego samego.
      - name: Ensure debug keystore (commit if first time)
        run: |
          if [ ! -f app/debug.keystore ]; then
            echo "Generating new debug.keystore"
            keytool -genkey -noprompt -v \
              -keystore app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=GymTracker Debug,O=GymTracker,C=PL"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add app/debug.keystore
            git commit -m "ci: dodaj stały debug.keystore (auto-update fix)"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "debug.keystore already exists, using it"
          fi

      # v1.27 FAZA 6 — pełny system testów: logika (FAZA 2) + snapshoty
      # ekranów (FAZA 3) + migracje/backup (FAZA 4) + flow użytkownika
      # (FAZA 5). Wszystko JVM/Robolectric — bez emulatora.
      - name: Run test suite (logika + snapshoty + migracje + flow)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # v1.27 — raporty Trace Reporter (snapshoty ekranów: co user widzi i dlaczego)
      - name: Upload trace reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-reports
          path: app/build/reports/traces/
          if-no-files-found: warn
          retention-days: 14

      # v1.27 FAZA 0.4 — raport pokrycia testami (nie blokuje buildu APK)
      - name: Coverage report (JaCoCo)
        run: ./gradlew :app:jacocoTestReport --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html/
          if-no-files-found: warn
          retention-days: 14

      # v1.27 FAZA 6.2/6.3 — zbiorczy raport stanu przed release.
      # Pisze do panelu GitHub Actions Summary: wynik testów, pokrycie,
      # liczba snapshotów ekranów. Jeden rzut oka = stan aplikacji.
      - name: Pre-release summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          tests = failed = skipped = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              tests += int(r.get('tests', 0))
              failed += int(r.get('failures', 0)) + int(r.get('errors', 0))
              skipped += int(r.get('skipped', 0))
          passed = tests - failed - skipped
          traces = sorted(glob.glob('app/build/reports/traces/*.txt'))
          out = os.environ.get('GITHUB_STEP_SUMMARY')
          if not out:
              raise SystemExit(0)
          with open(out, 'a') as o:
              o.write('## System testów GymTracker — stan przed release\n\n')
              status = 'WSZYSTKO ZIELONE' if failed == 0 and tests > 0 else 'UWAGA — sprawdz'
              o.write(f'**{status}**\n\n')
              o.write('| Metryka | Wartosc |\n|---|---|\n')
              o.write(f'| Testy zielone | {passed} / {tests} |\n')
              if failed:
                  o.write(f'| Testy FAIL | {failed} |\n')
              if skipped:
                  o.write(f'| Testy pominiete | {skipped} |\n')
              o.write(f'| Snapshoty ekranow (trace) | {len(traces)} |\n')
              o.write('\nSzczegolowe pokrycie per-pakiet: artifact `coverage-report`.\n')
              o.write('Snapshoty ekranow (co widzi user): artifact `trace-reports`.\n\n')
              if traces:
                  o.write('<details><summary>Snapshoty ekranow</summary>\n\n')
                  for t in traces:
                      o.write(f'- {os.path.basename(t)[:-4]}\n')
                  o.write('\n</details>\n')
          print(f'Summary: {passed}/{tests} zielone, {len(traces)} snapshotow')
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Read versionName
        id: ver
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Detected versionName: $VERSION (branch: $BRANCH)"

      - name: Rename APK with version
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/gymtracker-v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.branch }}-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.branch }}
          path: artifacts/gymtracker-v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.branch }}-debug.apk
          if-no-files-found: error
          retention-days: 30
